name: HTML to PDF Converter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: html to pdf
        uses: misaelnieto/web_to_pdf_action@master
        with:
          webPageURL: https://mimij0.github.io/joportfolio/
          outputFile: portfolio_Jolin.pdf
          usePuppeteer: true
          pdfOptions: '{"format": "Letter", "margin": {"top": "10mm", "left": "10mm", "right": "10mm", "bottom": "10mm"}}'

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: portfolio_Jolin.pdf
