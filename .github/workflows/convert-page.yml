name: Convert Webpage to PDF

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'The webpage URL to convert'
        required: true
        default: 'https://example.com'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Convert Webpage to PDF with Chrome
        run: |
          google-chrome --headless --disable-gpu --no-sandbox --print-to-pdf=output.pdf "${{ github.event.inputs.url }}"

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-pdf
          path: output.pdf
